<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">IntelliVox system architecture</title><desc id="desc">Browser speech controls feed a React app, which streams responses through a Supabase Edge Function using Groq with Pollinations fallback and stores chats and profiles in Supabase.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#182744"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8ce7d6"/></marker><style>.t{font:600 18px Manrope,Arial;fill:#eff7ff}.s{font:14px Manrope,Arial;fill:#bdcce2}.k{font:700 13px monospace;letter-spacing:1px;fill:#87dfe8}.box{fill:#15253e;stroke:#54718d;stroke-width:2}.line{stroke:#8ce7d6;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="720" rx="26" fill="url(#bg)"/><text x="54" y="58" class="k">INTELLIVOX / SPEAK → STREAM → REMEMBER</text><text x="54" y="92" class="t" font-size="25">Context-aware voice intelligence</text>
<g><rect class="box" x="55" y="220" width="210" height="190" rx="18"/><text class="k" x="79" y="256">USER</text><text class="t" x="79" y="294">Voice or text</text><text class="s" x="79" y="327">Hear spoken reply</text><text class="s" x="79" y="354">Captions on / off</text></g>
<g><rect class="box" x="335" y="170" width="260" height="280" rx="18"/><text class="k" x="359" y="206">BROWSER CLIENT</text><text class="t" x="359" y="244">React 18 + TypeScript</text><text class="s" x="359" y="277">Speech recognition</text><text class="s" x="359" y="304">Text-to-speech synthesis</text><text class="s" x="359" y="331">Chat context + transcript</text><text class="s" x="359" y="358">SSE response rendering</text><text class="s" x="359" y="385">Multilingual voice options</text></g>
<g><rect class="box" x="665" y="170" width="255" height="280" rx="18"/><text class="k" x="689" y="206">SERVERLESS ROUTER</text><text class="t" x="689" y="244">Supabase Edge Function</text><text class="s" x="689" y="277">Deno / TypeScript</text><text class="s" x="689" y="304">Protected AI proxy</text><text class="s" x="689" y="331">Streams event responses</text><text class="s" x="689" y="358">Provider fallback logic</text></g>
<g><rect class="box" x="985" y="105" width="170" height="150" rx="18"/><text class="k" x="1009" y="141">PRIMARY</text><text class="t" x="1009" y="179">Groq API</text><text class="s" x="1009" y="212">Streaming LLM</text></g>
<g><rect class="box" x="985" y="315" width="170" height="150" rx="18"/><text class="k" x="1009" y="351">FALLBACK</text><text class="t" x="1009" y="389">Pollinations</text><text class="s" x="1009" y="422">Streaming LLM</text></g>
<g><rect class="box" x="335" y="520" width="585" height="125" rx="18"/><text class="k" x="359" y="556">USER DATA + CHAT HISTORY</text><text class="t" x="359" y="594">Supabase Auth · Database · Storage</text><text class="s" x="359" y="622">Profiles · preferences · conversations · messages</text></g>
<path class="line" d="M265 315H324"/><path class="line" d="M595 310H654"/><path class="line" d="M920 250C950 250 952 180 974 180"/><path class="line" d="M920 350C950 350 952 390 974 390"/><path class="line" d="M465 450V509"/><path class="line" d="M795 450V500H720"/><path class="line" d="M335 582C285 540 285 430 335 408"/><text class="s" x="55" y="685">Supabase secures provider credentials, streams replies through the app, and persists user and chat state.</text></svg>
