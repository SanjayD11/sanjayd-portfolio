<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">CodeSentry system architecture</title><desc id="desc">A source ZIP moves through authenticated upload, deterministic static analysis, AI enrichment, MySQL persistence, and PDF reporting.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#182744"/></linearGradient><linearGradient id="glow"><stop stop-color="#56d8ef"/><stop offset="1" stop-color="#a1ed67"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8ce7d6"/></marker><style>.t{font:600 18px Manrope,Arial;fill:#eff7ff}.s{font:14px Manrope,Arial;fill:#bdcce2}.k{font:700 13px monospace;letter-spacing:1px;fill:#87dfe8}.box{fill:#15253e;stroke:#54718d;stroke-width:2}.b2{fill:#183048;stroke:#59cfe5}.line{stroke:#8ce7d6;stroke-width:3;marker-end:url(#a)}.hint{font:13px monospace;fill:#a9ed7b}</style></defs><rect width="1200" height="680" rx="26" fill="url(#bg)"/><text x="54" y="58" class="k">CODESENTRY / REQUEST → EVIDENCE → REPORT</text><text x="54" y="92" class="t" font-size="25">Source-code security analysis pipeline</text>
<g><rect class="box" x="55" y="170" width="220" height="155" rx="18"/><text class="k" x="78" y="204">01 / CLIENT</text><text class="t" x="78" y="240">React web app</text><text class="s" x="78" y="270">Sign in · projects</text><text class="s" x="78" y="294">Upload ZIP · inspect scans</text></g>
<g><rect class="box b2" x="345" y="145" width="245" height="205" rx="18"/><text class="k" x="369" y="180">02 / ACCESS + API</text><text class="t" x="369" y="217">Spring Boot REST</text><text class="s" x="369" y="248">Spring Security · JWT</text><text class="s" x="369" y="274">ZIP integrity + extension checks</text><text class="s" x="369" y="300">Project / scan ownership</text></g>
<g><rect class="box b2" x="660" y="145" width="245" height="205" rx="18"/><text class="k" x="684" y="180">03 / DETERMINISTIC SAST</text><text class="t" x="684" y="217">Scanner pipeline</text><text class="s" x="684" y="248">Discover + classify files</text><text class="s" x="684" y="274">Language-specific rule engines</text><text class="s" x="684" y="300">Severity · location · evidence</text></g>
<g><rect class="box" x="975" y="145" width="175" height="205" rx="18"/><text class="k" x="998" y="180">04 / STORE</text><text class="t" x="998" y="217">MySQL</text><text class="s" x="998" y="248">Projects · uploads</text><text class="s" x="998" y="274">Scans · findings</text><text class="s" x="998" y="300">Users · reports</text></g>
<path class="line" d="M275 245H334"/><path class="line" d="M590 245H649"/><path class="line" d="M905 245H964"/>
<g><rect class="box" x="345" y="435" width="350" height="165" rx="18"/><text class="k" x="369" y="470">05 / AI ENRICHMENT</text><text class="t" x="369" y="507">OpenRouter → Groq</text><text class="s" x="369" y="538">Explain existing findings</text><text class="s" x="369" y="564">Remediation guidance · scan summary</text></g>
<g><rect class="box" x="775" y="435" width="375" height="165" rx="18"/><text class="k" x="799" y="470">06 / DELIVER</text><text class="t" x="799" y="507">Dashboard + PDF reports</text><text class="s" x="799" y="538">Scan history · finding details</text><text class="s" x="799" y="564">On-demand report generation</text></g>
<path class="line" d="M782 350 C782 394 610 391 535 424"/><path class="line" d="M695 518H764"/><path class="line" d="M1060 435V362"/><text class="hint" x="55" y="642">Static rules establish findings; AI adds explanations and suggested remediation.</text></svg>
