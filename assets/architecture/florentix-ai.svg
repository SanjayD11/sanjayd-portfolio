<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Florentix AI architecture</title><desc id="desc">A compressed plant photo is analyzed by a FastAPI orchestrator using cloud Gemma vision first and a local TensorFlow Lite classifier as fallback, with results and chat saved to Firebase.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#182744"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8ce7d6"/></marker><style>.t{font:600 18px Manrope,Arial;fill:#eff7ff}.s{font:14px Manrope,Arial;fill:#bdcce2}.k{font:700 13px monospace;letter-spacing:1px;fill:#87dfe8}.box{fill:#15253e;stroke:#54718d;stroke-width:2}.line{stroke:#8ce7d6;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="640" rx="26" fill="url(#bg)"/><text x="54" y="58" class="k">FLORENTIX AI / CAPTURE → DIAGNOSE → GUIDE</text><text x="54" y="92" class="t" font-size="25">Hybrid plant health inference</text>
<g><rect class="box" x="55" y="220" width="215" height="175" rx="18"/><text class="k" x="79" y="256">GROWER</text><text class="t" x="79" y="294">Plant photo</text><text class="s" x="79" y="327">Vercel web app</text><text class="s" x="79" y="354">Compress image in browser</text></g><g><rect class="box" x="350" y="180" width="250" height="255" rx="18"/><text class="k" x="374" y="216">ORCHESTRATOR</text><text class="t" x="374" y="254">FastAPI · Render</text><text class="s" x="374" y="287">Validate + route request</text><text class="s" x="374" y="314">Async diagnosis pipeline</text><text class="s" x="374" y="341">SSE botanist chat</text><text class="s" x="374" y="368">Confidence-based fallback</text></g><g><rect class="box" x="690" y="105" width="255" height="165" rx="18"/><text class="k" x="714" y="141">TIER 1 / CLOUD VISION</text><text class="t" x="714" y="179">Gemma 3 via OpenRouter</text><text class="s" x="714" y="212">Cloud plant diagnosis</text><text class="s" x="714" y="239">Use valid confident result</text></g><g><rect class="box" x="690" y="350" width="255" height="165" rx="18"/><text class="k" x="714" y="386">TIER 2 / LOCAL EDGE</text><text class="t" x="714" y="424">TensorFlow Lite CNN</text><text class="s" x="714" y="457">XNNPACK CPU inference</text><text class="s" x="714" y="484">Fallback on cloud failure</text></g><g><rect class="box" x="1000" y="220" width="155" height="175" rx="18"/><text class="k" x="1024" y="256">PERSIST</text><text class="t" x="1024" y="294">Firebase</text><text class="s" x="1024" y="327">Auth · Firestore</text><text class="s" x="1024" y="354">Diagnosis · chat</text></g><path class="line" d="M270 307H339"/><path class="line" d="M600 255C642 255 650 190 679 190"/><path class="line" d="M600 365C642 365 650 430 679 430"/><path class="line" d="M945 190C980 190 980 270 989 270"/><path class="line" d="M945 430C980 430 980 350 989 350"/><text class="s" x="55" y="580">Cloud inference is attempted first; the local model handles configured fallback cases.</text></svg>
