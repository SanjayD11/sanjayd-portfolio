<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">NourishNet system architecture</title><desc id="desc">A React food-sharing client uses Supabase Auth, PostgreSQL, realtime updates and storage, and calls Pollinations Vision for food safety analysis.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#182744"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8ce7d6"/></marker><style>.t{font:600 18px Manrope,Arial;fill:#eff7ff}.s{font:14px Manrope,Arial;fill:#bdcce2}.k{font:700 13px monospace;letter-spacing:1px;fill:#87dfe8}.box{fill:#15253e;stroke:#54718d;stroke-width:2}.line{stroke:#8ce7d6;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="700" rx="26" fill="url(#bg)"/><text x="54" y="58" class="k">NOURISHNET / SHARE → REQUEST → CONNECT</text><text x="54" y="92" class="t" font-size="25">Community food-sharing platform</text>
<g><rect class="box" x="65" y="205" width="220" height="180" rx="18"/><text class="k" x="89" y="241">PEOPLE</text><text class="t" x="89" y="279">Donor / requester</text><text class="s" x="89" y="312">Post surplus food</text><text class="s" x="89" y="339">Browse and request</text></g>
<g><rect class="box" x="365" y="175" width="270" height="220" rx="18"/><text class="k" x="389" y="211">WEB CLIENT</text><text class="t" x="389" y="249">React + TypeScript</text><text class="s" x="389" y="282">Listings · requests</text><text class="s" x="389" y="309">Profiles · ratings</text><text class="s" x="389" y="336">Realtime status updates</text></g>
<g><rect class="box" x="740" y="115" width="375" height="135" rx="18"/><text class="k" x="764" y="151">SUPABASE AUTH + DATA</text><text class="t" x="764" y="189">Auth · PostgreSQL · Storage</text><text class="s" x="764" y="222">Accounts · posts · requests · media</text></g>
<g><rect class="box" x="740" y="310" width="375" height="135" rx="18"/><text class="k" x="764" y="346">LIVE DATA</text><text class="t" x="764" y="384">Supabase Realtime</text><text class="s" x="764" y="417">Post and request status changes</text></g>
<g><rect class="box" x="740" y="505" width="375" height="130" rx="18"/><text class="k" x="764" y="541">FOOD SAFETY SCANNER</text><text class="t" x="764" y="579">Pollinations AI Vision API</text><text class="s" x="764" y="610">Food health analysis</text></g>
<path class="line" d="M285 295H354"/><path class="line" d="M635 245C685 245 694 182 729 182"/><path class="line" d="M635 310C686 310 694 378 729 378"/><path class="line" d="M635 354C686 420 694 570 729 570"/><path class="line" d="M740 416C670 480 670 435 635 372"/><text class="s" x="65" y="670">Supabase synchronizes community listings; Pollinations Vision supplies AI food-safety analysis.</text></svg>
